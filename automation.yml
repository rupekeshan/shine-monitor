alias: Solar Notification
description: Real-time solar system monitoring with smart alerts
triggers:
  - trigger: state
    entity_id: sensor.current_solar_production
    to: unavailable
    for: "00:30:00"
    id: wifi_down
  - trigger: state
    entity_id: binary_sensor.solar_plant_rupekeshan_has_inverter_alarms
    to: "on"
    id: inverter_alarm
  - trigger: sun
    event: sunset
    offset: "-01:00:00"
    id: daily_check
conditions:
  - condition: sun
    after: sunrise
    before: sunset
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: wifi_down
        sequence:
          - variables:
              previous_volume: >-
                {{ state_attr('media_player.rupekeshan_s_echo_dot',
                'volume_level') | float(0.5) }}
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: 1
          - action: notify.alexa_media_rupekeshan_s_echo_dot
            data:
              message: >-
                Solar alert. The Shine Monitor data is missing. Please check
                your terrace WiFi.
              data:
                type: tts
          - delay: "00:00:08"
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: "{{ previous_volume }}"
          - action: notify.family_phones
            data:
              title: Solar WiFi Down
              message: Shine Monitor offline for 30+ minutes. Check terrace WiFi.
              data:
                priority: high
                ttl: 0
      - conditions:
          - condition: trigger
            id: inverter_alarm
        sequence:
          - variables:
              previous_volume: >-
                {{ state_attr('media_player.rupekeshan_s_echo_dot',
                'volume_level') | float(0.5) }}
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: 1
          - action: notify.alexa_media_rupekeshan_s_echo_dot
            data:
              message: >-
                Solar alert. The inverter has a fault. Check the display for an
                error code.
              data:
                type: tts
          - delay: "00:00:08"
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: "{{ previous_volume }}"
          - action: notify.family_phones
            data:
              title: ⚠️ Inverter Alarm
              message: Real inverter fault detected. Check display for error code.
              data:
                priority: high
                ttl: 0
      - conditions:
          - condition: trigger
            id: daily_check
          - condition: numeric_state
            entity_id: sensor.solar_plant_rupekeshan_daily_energy
            below: 0.1
        sequence:
          - variables:
              previous_volume: >-
                {{ state_attr('media_player.rupekeshan_s_echo_dot',
                'volume_level') | float(0.5) }}
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: 1
          - action: notify.alexa_media_rupekeshan_s_echo_dot
            data:
              message: >-
                Solar alert. The inverter produced zero power today. Check for
                an error on the display.
              data:
                type: tts
          - delay: "00:00:08"
          - action: media_player.volume_set
            target:
              entity_id: media_player.rupekeshan_s_echo_dot
            data:
              volume_level: "{{ previous_volume }}"
          - action: notify.family_phones
            data:
              title: Zero Solar Production
              message: Inverter produced 0 kWh today. Check for errors.


---

alias: Solar Daily Reading Announcement
description: Announce daily solar production summary on Alexa at sunset
triggers:
  - trigger: sun
    event: sunset
    offset: "-00:30:00"
actions:
  - variables:
      previous_volume: >-
        {{ state_attr('media_player.rupekeshan_s_echo_dot', 'volume_level') |
        float(0.5) }}
  - action: media_player.volume_set
    target:
      entity_id: media_player.rupekeshan_s_echo_dot
    data:
      volume_level: 1
  - action: notify.alexa_media_rupekeshan_s_echo_dot
    data:
      message: >
        Today your solar panels produced  {{
        states('sensor.solar_plant_rupekeshan_daily_energy') | float(0) | round(1) }}
        kilowatt hours. This month you have generated  {{
        states('sensor.solar_plant_rupekeshan_monthly_energy') | float(0) | round(1) }}
        kilowatt hours.
      data:
        type: tts
  - delay: "00:00:10"
  - action: media_player.volume_set
    target:
      entity_id: media_player.rupekeshan_s_echo_dot
    data:
      volume_level: "{{ previous_volume }}"
  - action: notify.family_phones
    data:
      title: Daily Solar Report
      message: >
        Today: {{ states('sensor.solar_plant_rupekeshan_daily_energy') |
        float(0) | round(1) }} kWh This month: {{
        states('sensor.solar_plant_rupekeshan_monthly_energy') | float(0) | round(1) }} kWh
